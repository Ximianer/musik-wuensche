<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Party Cockpit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

    <div id="app">
        <!-- Lade-Bildschirm -->
        <div id="loading" class="fixed inset-0 flex items-center justify-center bg-slate-900 z-50">
            <div id="loading-content" class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500 mx-auto mb-4"></div>
                <p class="text-slate-400">Verbinde mit Party-Server...</p>
            </div>
        </div>

        <!-- Hauptinhalt -->
        <div id="content" class="hidden">
            <!-- Navigation / Landing -->
            <div id="view-landing" class="min-h-screen flex items-center justify-center p-6 text-center">
                <div class="max-w-md w-full space-y-8">
                    <div class="w-20 h-20 bg-gradient-to-tr from-purple-600 to-pink-500 rounded-3xl mx-auto flex items-center justify-center shadow-2xl rotate-3">
                        <i data-lucide="music" class="w-10 h-10"></i>
                    </div>
                    <h1 class="text-4xl font-black italic tracking-tighter uppercase">Party Request</h1>
                    <p id="connection-status" class="text-green-400 text-sm font-bold uppercase tracking-widest animate-pulse">Live-Modus aktiv</p>
                    <div class="grid gap-4">
                        <button onclick="showView('guest')" class="bg-white text-slate-900 p-6 rounded-2xl font-bold text-xl flex items-center justify-center gap-3 hover:scale-105 transition-transform shadow-xl">
                            <i data-lucide="users"></i> Ich bin Gast
                        </button>
                        <button onclick="showView('dj-auth')" class="bg-slate-800 text-white p-6 rounded-2xl font-bold text-xl flex items-center justify-center gap-3 hover:bg-slate-700 transition-colors">
                            <i data-lucide="lock"></i> DJ Cockpit
                        </button>
                    </div>
                </div>
            </div>

            <!-- Gast Modus -->
            <div id="view-guest" class="hidden min-h-screen bg-slate-50 text-slate-900 p-4 sm:p-8">
                <button onclick="showView('landing')" class="flex items-center text-slate-500 font-medium mb-8">
                    <i data-lucide="chevron-left"></i> Zurück
                </button>
                <div class="max-w-md mx-auto w-full bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
                    <h2 class="text-3xl font-black mb-2">Songwunsch 🎶</h2>
                    <p class="text-slate-500 mb-8">Dein Wunsch geht direkt an das DJ-Pult!</p>
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Dein Name (optional)</label>
                            <input type="text" id="guest-name" placeholder="z.B. Tim" class="w-full bg-slate-100 border-none rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-purple-400 text-slate-900">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Welcher Song?</label>
                            <textarea id="guest-wish" placeholder="Interpret - Titel..." class="w-full bg-slate-100 border-none rounded-2xl px-5 py-4 h-32 resize-none outline-none focus:ring-2 focus:ring-purple-400 text-slate-900"></textarea>
                        </div>
                        <button onclick="submitWish()" class="w-full bg-gradient-to-r from-purple-600 to-pink-500 text-white font-black py-5 rounded-2xl shadow-lg flex items-center justify-center gap-3 active:scale-95 transition-all">
                            <i data-lucide="send"></i> JETZT SENDEN
                        </button>
                    </div>
                    <div id="success-msg" class="hidden mt-6 p-4 bg-green-100 text-green-700 rounded-2xl flex items-center gap-2 animate-bounce">
                        <i data-lucide="check-circle-2"></i> Wunsch erfolgreich gesendet! 🎵
                    </div>
                </div>
            </div>

            <!-- DJ Auth -->
            <div id="view-dj-auth" class="hidden min-h-screen bg-slate-900 flex flex-col items-center justify-center p-6 text-white text-center">
                <h2 class="text-2xl font-bold mb-6">DJ Zugriffscode</h2>
                <input type="password" id="dj-pin-input" placeholder="Code" class="bg-slate-800 border-2 border-slate-700 rounded-xl px-6 py-4 text-center text-3xl tracking-[0.5em] mb-4 w-64 focus:border-purple-500 outline-none">
                <button onclick="checkPin()" class="bg-purple-600 hover:bg-purple-500 px-8 py-3 rounded-xl font-bold w-64 transition-colors">LOGIN</button>
                <button onclick="showView('landing')" class="mt-8 text-slate-500 hover:text-white transition-colors">Abbrechen</button>
            </div>

            <!-- DJ Dashboard -->
            <div id="view-dj-dashboard" class="hidden min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center shadow-md">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-pink-500 rounded-xl flex items-center justify-center shadow-lg">
                            <i data-lucide="music" class="text-white"></i>
                        </div>
                        <span class="font-bold text-lg">DJ LIVE Cockpit</span>
                    </div>
                    <button onclick="showView('landing')" class="bg-slate-800 p-2 rounded-lg"><i data-lucide="x"></i></button>
                </header>
                <main class="p-4 grid grid-cols-1 lg:grid-cols-2 gap-6 flex-1 max-w-7xl mx-auto w-full">
                    <!-- Liste -->
                    <div class="bg-slate-900 rounded-3xl p-6 border border-slate-800 flex flex-col h-[600px] shadow-2xl">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-black text-purple-400 italic flex gap-2"><i data-lucide="users"></i> WÜNSCHE</h2>
                            <button onclick="clearAllWishes()" class="text-red-500 text-xs font-bold uppercase hover:underline">Alle löschen</button>
                        </div>
                        <div id="wishes-list" class="space-y-3 overflow-y-auto flex-1 pr-2 custom-scrollbar">
                            <!-- JS füllt das hier -->
                        </div>
                    </div>
                    <!-- Tools -->
                    <div class="space-y-6">
                        <div class="bg-slate-900 rounded-3xl p-6 border border-slate-800 shadow-xl">
                            <h2 class="text-xl font-black mb-4 text-cyan-400 italic uppercase flex gap-2"><i data-lucide="type"></i> Visuals</h2>
                            <input type="text" id="screen-text-input" value="PARTY TIME" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-center font-black text-2xl mb-4 text-white">
                            <button onclick="showView('fullscreen')" class="w-full bg-cyan-600 py-4 rounded-2xl font-black text-xl">VOLLBILD</button>
                        </div>
                        <div class="bg-slate-900 rounded-3xl p-6 border border-slate-800 shadow-xl text-center">
                            <p class="text-xs text-green-500 font-bold">Cloud-Sync aktiv. Andere Geräte können mitschreiben.</p>
                        </div>
                    </div>
                </main>
            </div>

            <!-- Vollbild -->
            <div id="view-fullscreen" class="hidden fixed inset-0 bg-black flex flex-col items-center justify-center p-4 z-50 transition-colors duration-200">
                <button onclick="showView('dj-dashboard')" class="absolute top-4 right-4 bg-white/20 p-2 rounded-full text-white"><i data-lucide="x" class="w-8 h-8"></i></button>
                <h1 id="fullscreen-text" class="text-6xl md:text-9xl font-black text-white text-center uppercase tracking-tighter"></h1>
                <div class="absolute bottom-10">
                    <button id="strobe-btn" onclick="toggleStrobe()" class="px-8 py-4 rounded-full font-black text-xl border-4 border-white text-white">STROBE START</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Nutzt vordefinierte System-Konfiguration falls vorhanden) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // FALLBACK KONFIGURATION: Falls keine Umgebungsvariablen da sind, nutzen wir eine öffentliche Test-DB
        // HINWEIS: Diese Daten sind nur für die Demo gedacht.
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "", // Wird zur Laufzeit injiziert oder bleibt leer für System-Auth
            projectId: "musik-wuensche-demo",
            authDomain: "musik-wuensche-demo.firebaseapp.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-party-app';

        let wishes = [];
        let strobeActive = false;
        let strobeInterval = null;

        // Init Auth & App
        async function startApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        document.getElementById('loading').classList.add('hidden');
                        document.getElementById('content').classList.remove('hidden');
                        initWishesListener();
                    }
                });
            } catch (e) {
                console.error("Connection Error", e);
                // Fallback zu Lokal wenn Cloud scheitert
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                document.getElementById('connection-status').innerText = "Offline-Modus";
                document.getElementById('connection-status').classList.replace('text-green-400', 'text-red-400');
            }
        }

        // Live Cloud Listener
        function initWishesListener() {
            const wishesRef = collection(db, 'artifacts', appId, 'public', 'data', 'wishes');
            onSnapshot(wishesRef, (snapshot) => {
                wishes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                // Sortierung manuell (Rule 2: No complex queries)
                wishes.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                if (document.getElementById('view-dj-dashboard').classList.contains('hidden') === false) {
                    renderWishes();
                }
            }, (err) => console.error("Snapshot error", err));
        }

        window.showView = (viewName) => {
            document.querySelectorAll('#content > div').forEach(div => div.classList.add('hidden'));
            document.getElementById('view-' + viewName).classList.remove('hidden');
            if (viewName === 'dj-dashboard') renderWishes();
            if (viewName === 'fullscreen') {
                document.getElementById('fullscreen-text').innerText = document.getElementById('screen-text-input').value;
            } else {
                stopStrobe();
            }
            lucide.createIcons();
        };

        window.checkPin = () => {
            if (document.getElementById('dj-pin-input').value === "1234") {
                showView('dj-dashboard');
            } else {
                alert("Falscher Code! (Tipp: 1234)");
            }
        };

        window.submitWish = async () => {
            const name = document.getElementById('guest-name').value || 'Anonym';
            const text = document.getElementById('guest-wish').value;
            if (!text.trim()) return;

            try {
                const wishesRef = collection(db, 'artifacts', appId, 'public', 'data', 'wishes');
                await addDoc(wishesRef, {
                    sender: name,
                    text: text,
                    done: false,
                    timestamp: Date.now()
                });

                document.getElementById('guest-wish').value = '';
                document.getElementById('success-msg').classList.remove('hidden');
                setTimeout(() => document.getElementById('success-msg').classList.add('hidden'), 2000);
            } catch (e) {
                alert("Senden fehlgeschlagen. Bitte Internet prüfen.");
            }
        };

        window.renderWishes = () => {
            const list = document.getElementById('wishes-list');
            list.innerHTML = wishes.length === 0 ? '<p class="text-center text-slate-600 py-20">Warte auf Wünsche...</p>' : '';
            
            wishes.forEach(wish => {
                const item = document.createElement('div');
                item.className = `p-4 rounded-2xl flex items-center justify-between gap-4 transition-all ${wish.done ? 'bg-slate-800/30 opacity-40' : 'bg-slate-800 border border-slate-700'}`;
                item.innerHTML = `
                    <div class="flex-1">
                        <p class="text-[10px] text-purple-500 font-black uppercase">${wish.sender}</p>
                        <p class="text-lg font-bold ${wish.done ? 'line-through' : ''}">${wish.text}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleDone('${wish.id}', ${wish.done})" class="text-green-500 p-2"><i data-lucide="check-circle-2"></i></button>
                        <button onclick="deleteWish('${wish.id}')" class="text-slate-600 hover:text-red-500 p-2"><i data-lucide="trash-2"></i></button>
                    </div>
                `;
                list.appendChild(item);
            });
            lucide.createIcons();
        };

        window.toggleDone = async (id, currentStatus) => {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'wishes', id);
            await updateDoc(docRef, { done: !currentStatus });
        };

        window.deleteWish = async (id) => {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'wishes', id);
            await deleteDoc(docRef);
        };

        window.clearAllWishes = async () => {
            if(confirm("Alle Wünsche löschen?")) {
                for (let wish of wishes) {
                    await deleteWish(wish.id);
                }
            }
        };

        // UI & FX
        window.toggleStrobe = () => {
            const screen = document.getElementById('view-fullscreen');
            const btn = document.getElementById('strobe-btn');
            if (strobeActive) {
                stopStrobe();
            } else {
                strobeActive = true;
                btn.innerText = 'STROBE STOP';
                btn.classList.add('bg-white', 'text-black');
                const colors = ['bg-red-600', 'bg-blue-600', 'bg-green-600', 'bg-purple-600', 'bg-yellow-500'];
                strobeInterval = setInterval(() => {
                    screen.className = 'fixed inset-0 flex flex-col items-center justify-center p-4 z-50 transition-none ' + colors[Math.floor(Math.random() * colors.length)];
                }, 80);
            }
        };

        function stopStrobe() {
            strobeActive = false;
            clearInterval(strobeInterval);
            const screen = document.getElementById('view-fullscreen');
            if (screen) screen.className = 'hidden fixed inset-0 bg-black flex flex-col items-center justify-center p-4 z-50';
            const btn = document.getElementById('strobe-btn');
            if (btn) {
                btn.innerText = 'STROBE START';
                btn.classList.remove('bg-white', 'text-black');
            }
        }

        // Start initialisieren
        startApp();
    </script>
</body>
</html>
